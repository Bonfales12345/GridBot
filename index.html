<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: linear-gradient(180deg, #01183c 0%, #005fb8 100%);
            color: #ffffff;
            gap: 2.5rem;
        }

        .title {
            font-size: 6rem;
            font-weight: 800;
            letter-spacing: -0.02em;
            text-shadow: 0 12px 24px rgba(0, 0, 0, 0.5);
            user-select: none;
        }

        .invite-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 16px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(12px);
            border-radius: 12px;
            text-decoration: none;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .invite-btn:hover {
            background: #ffffff;
            color: #004d9c;
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.35);
        }

        .invite-btn:active {
            transform: translateY(0);
        }
    </style>
</head>
<body>

    <h1 class="title">Grid</h1>

    <a href="https://discord.com/oauth2/authorize?client_id=1538931516518957086&permissions=8&integration_type=0&scope=bot+applications.commands" 
       class="invite-btn" 
       target="_blank" 
       rel="noopener noreferrer">
        Invite to Your Discord Server
    </a>

</body>
</html>
